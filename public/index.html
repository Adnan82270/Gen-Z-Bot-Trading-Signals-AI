<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Z Bot - Trading Signals AI</title>
    <!-- Google Fonts for exact match -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030308;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        /* Background Ambient Glow */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, rgba(3, 3, 8, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        /* 3D Rotating Globe Container */
        .globe-container {
            position: relative.
            width: 240px.
            height: 240px.
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Outer Rotating Ring (Clockwise 4 dots) */
        .outer-orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px dashed rgba(0, 229, 255, 0.2);
            animation: spinClockwise 15s linear infinite;
        }
        .outer-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #00e5ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
        }
        .od-1 { top: -4px; left: calc(50% - 4px); }
        .od-2 { bottom: -4px; left: calc(50% - 4px); }
        .od-3 { left: -4px; top: calc(50% - 4px); }
        .od-4 { right: -4px; top: calc(50% - 4px); }

        /* Inner Orbit (Anti-Clockwise dots) */
        .inner-orbit {
            position: absolute;
            width: 75%;
            height: 75%;
            border-radius: 50%;
            border: 1px dotted rgba(0, 229, 255, 0.3);
            animation: spinAntiClockwise 10s linear infinite;
        }
        .inner-dot {
            position: absolute.
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e5ff;
        }
        .id-1 { top: 10%; left: 15%; }
        .id-2 { bottom: 15%; right: 20%; }

        /* Central 3D Football/Sphere Core */
        .sphere-core {
            width: 170px;
            height: 170px;
            background: radial-gradient(circle at 30% 30%, rgba(0, 229, 255, 0.25), rgba(5, 15, 35, 0.9));
            border-radius: 50%;
            box-shadow: inset 0 0 25px rgba(0, 229, 255, 0.4), 0 0 30px rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
            animation: rotateSphere 20s linear infinite;
            border: 1px solid rgba(0, 229, 255, 0.4);
        }
        
        /* Inner mesh/nodes simulation */
        .mesh-node {
            position: absolute;
            background: #00e5ff;
            border-radius: 50%;
            box-shadow: 0 0 6px #00e5ff;
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes spinClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spinAntiClockwise {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes rotateSphere {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Custom inputs & buttons styling */
        .custom-input {
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.25);
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
            outline: none;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 50%, #92fe9d 100%);
            background-size: 200% auto;
            transition: 0.5s;
        }
        .btn-gradient:hover {
            background-position: right center;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 relative">

    <!-- Background Glow Elements -->
    <div class="bg-glow top-10 left-1/2 -translate-x-1/2"></div>

    <div class="w-full max-w-md mx-auto flex flex-col items-center z-10 space-y-6 my-auto">
        
        <!-- Top Badge -->
        <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-950/20 shadow-[0_0_15px_rgba(0,229,255,0.15)]">
            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            <span class="text-xs font-orbitron tracking-widest text-cyan-300 font-medium">LICENSE AUTHENTICATION</span>
        </div>

        <!-- Title Section -->
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-black font-orbitron tracking-wider text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.4)]">
                Gen<span class="text-cyan-400">-</span>Z Bot
            </h1>
            <div class="flex items-center justify-center space-x-3">
                <div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-cyan-400"></div>
                <span class="text-xs font-orbitron tracking-widest text-cyan-400/90 font-semibold">TRADING SIGNALS AI</span>
                <div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-cyan-400"></div>
            </div>
        </div>

        <!-- 3D Animated Globe / Neural Sphere -->
        <div class="globe-container my-2">
            <!-- Outer Clockwise Orbit -->
            <div class="outer-orbit">
                <div class="outer-dot od-1"></div>
                <div class="outer-dot od-2"></div>
                <div class="outer-dot od-3"></div>
                <div class="outer-dot od-4"></div>
            </div>

            <!-- Inner Anti-Clockwise Orbit -->
            <div class="inner-orbit">
                <div class="inner-dot id-1"></div>
                <div class="inner-dot id-2"></div>
            </div>

            <!-- Central Rotating Globe -->
            <div class="sphere-core">
                <!-- Random glowing neural nodes inside sphere -->
                <div class="mesh-node" style="top: 30%; left: 40%; width: 5px; height: 5px; animation-delay: 0.2s;"></div>
                <div class="mesh-node" style="top: 60%; left: 70%; width: 4px; height: 4px; animation-delay: 0.8s;"></div>
                <div class="mesh-node" style="top: 50%; left: 30%; width: 6px; height: 6px; animation-delay: 1.2s;"></div>
                <div class="mesh-node" style="top: 25% ; left: 65%; width: 4px; height: 4px; animation-delay: 0.5s;"></div>
                <div class="mesh-node" style="top: 75%; left: 45%; width: 5px; height: 5px; animation-delay: 1.5s;"></div>
            </div>
        </div>

        <!-- Subtext -->
        <div class="flex items-center justify-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
            <span class="text-xs font-orbitron tracking-widest text-cyan-400/80">NEURAL SECURITY CORE</span>
        </div>

        <!-- Input & Button Form -->
        <div class="w-full space-y-4 pt-2">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-cyan-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                </span>
                <input type="text" id="licenseKeyInput" placeholder="GENZBOT - XXXXXXXX" 
                    class="custom-input w-full py-3.5 pl-12 pr-4 rounded-xl text-sm font-orbitron tracking-wider text-cyan-200 placeholder-cyan-600/60 uppercase">
            </div>

            <button onclick="verifyLicense()" 
                class="btn-gradient w-full py-4 rounded-xl font-orbitron font-bold text-sm tracking-widest text-white shadow-[0_0_20px_rgba(0,198,255,0.4)] flex items-center justify-center space-x-2">
                <span>ACTIVATE AI</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
            
            <div id="errorMsg" class="text-center text-xs font-medium text-red-400 min-h-[16px]"></div>
        </div>

        <!-- Bottom Links -->
        <div class="w-full space-y-3 pt-2">
            <a href="#" class="flex items-center justify-between p-3.5 rounded-xl border border-cyan-500/20 bg-cyan-950/10 hover:bg-cyan-950/30 transition">
                <div class="flex items-center space-x-3">
                    <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    <span class="text-xs text-gray-300 font-medium">How to Get / Activate Your Gen-Z Bot License</span>
                </div>
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>

            <a href="https://t.me/" target="_blank" class="flex items-center justify-between p-3.5 rounded-xl border border-cyan-500/20 bg-cyan-950/10 hover:bg-cyan-950/30 transition">
                <div class="flex items-center space-x-3">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                    <span class="text-xs text-gray-300 font-medium">Get License Key — DM on Telegram</span>
                </div>
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </a>
        </div>

    </div>

    <!-- Script for verification handling -->
    <script>
        async function verifyLicense() {
            const keyInput = document.getElementById('licenseKeyInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            if (!keyInput) {
                errorMsg.innerText = "Please enter a license key!";
                return;
            }

            try {
                const response = await fetch('/api/verify-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: keyInput, deviceId: 'browser-device-01' })
                });

                const data = await response.json();
                if (data.success) {
                    errorMsg.style.color = "#00e5ff";
                    errorMsg.innerText = "License verified successfully! Redirecting...";
                    setTimeout(() => {
                        window.location.href = '/dashboard.html'; // Or dashboard view
                    }, 1000);
                } else {
                    errorMsg.style.color = "#ff4d4d";
                    errorMsg.innerText = data.message || "Invalid license key!";
                }
            } catch (err) {
                console.error(err);
                errorMsg.style.color = "#ff4d4d";
                errorMsg.innerText = "Server connection error!";
            }
        }
    </script>
</body>
</html>
