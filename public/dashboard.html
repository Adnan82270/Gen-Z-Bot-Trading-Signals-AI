<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Z Bot - Trading Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Ambient Glow */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(79, 172, 254, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Top Navigation / Header */
        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .logo-area {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #00f2fe;
            letter-spacing: 1px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: rgba(13, 20, 35, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            background: rgba(13, 20, 35, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 254, 0.05);
            margin-bottom: 30px;
        }

        /* Tab Content Views */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        /* Neural Core Orbit Section */
        .neural-core-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-orbit-system {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 1px dashed rgba(0, 242, 254, 0.2);
            animation: rotateClockwise 15s linear infinite;
        }
        .bg-orbit-node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 6px #00f2fe;
            top: 10px;
            left: 50%;
        }

        .neural-sphere {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 35%, #00f2fe 0%, #0c2d48 60%, #030712 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            z-index: 2;
        }

        .neural-sphere::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(to right, rgba(0,242,254,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,242,254,0.1) 1px, transparent 1px);
            background-size: 16px 16px;
            opacity: 0.6;
        }

        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px #00f2fe;
            animation: pulseGlow 2s infinite ease-in-out;
            z-index: 3;
        }
        .p1 { width: 4px; height: 4px; top: 20%; left: 30%; animation-delay: 0s; }
        .p2 { width: 5px; height: 5px; top: 50%; left: 80%; animation-delay: 0.4s; }
        .p3 { width: 3px; height: 3px; top: 75%; left: 25%; animation-delay: 0.8s; }
        .p4 { width: 6px; height: 6px; top: 25%; left: 65%; animation-delay: 1.2s; }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.6); opacity: 1; }
        }

        .orbit-ring-outer {
            position: absolute;
            width: 146px;
            height: 146px;
            border-radius: 50%;
            border: 1px dashed rgba(0, 242, 254, 0.25);
            animation: rotateClockwise 8s linear infinite;
            z-index: 4;
        }
        .dot-cw {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe;
        }
        .dot-cw:nth-child(1) { top: 0; left: calc(50% - 3px); }
        .dot-cw:nth-child(2) { bottom: 0; left: calc(50% - 3px); }
        .dot-cw:nth-child(3) { left: 0; top: calc(50% - 3px); }
        .dot-cw:nth-child(4) { right: 0; top: calc(50% - 3px); }

        .orbit-ring-inner {
            position: absolute;
            width: 132px;
            height: 132px;
            border-radius: 50%;
            border: 1px dashed rgba(79, 172, 254, 0.2);
            animation: rotateAntiClockwise 6s linear infinite;
            z-index: 4;
        }
        .dot-acw {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #4facfe;
            border-radius: 50%;
            box-shadow: 0 0 6px #4facfe;
        }
        .dot-acw:nth-child(1) { top: 15%; left: 15%; }
        .dot-acw:nth-child(2) { bottom: 15%; right: 15%; }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotateAntiClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .status-badge {
            background: rgba(0, 255, 128, 0.1);
            border: 1px solid rgba(0, 255, 128, 0.3);
            color: #00ff80;
            padding: 8px 16px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Orbit Action Button */
        .btn-orbit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 14px;
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(0, 242, 254, 0.4);
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .btn-orbit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 242, 254, 0.6);
        }

        /* Signal Result Box */
        .signal-display {
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        .signal-title {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .signal-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .signal-value.up { color: #00ff80; text-shadow: 0 0 15px rgba(0, 255, 128, 0.5); }
        .signal-value.down { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .signal-value.neutral { color: #f59e0b; text-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }

        .analysis-box {
            font-size: 12px;
            color: #cbd5e1;
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #00f2fe;
            line-height: 1.5;
        }

        /* Settings Form Styling */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-group select, .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 10px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group select:focus, .form-group input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid #00f2fe;
            border-radius: 10px;
            color: #00f2fe;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-save:hover {
            background: #00f2fe;
            color: #030712;
        }

        .logout-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #ef4444;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">Gen-Z Bot</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('signalView')">Signals</button>
            <button class="tab-btn" onclick="switchTab('settingsView')">Settings</button>
        </div>
    </header>

    <div class="main-container">
        
        <!-- SIGNALS & ORBIT VIEW -->
        <div id="signalView" class="view-section active">
            <div class="status-badge">STATUS: CONNECTED & LIVE 🚀</div>

            <!-- Neural Core Orbit Animation -->
            <div class="neural-core-container">
                <div class="bg-orbit-system">
                    <div class="bg-orbit-node"></div>
                </div>
                <div class="orbit-ring-outer">
                    <div class="dot-cw"></div>
                    <div class="dot-cw"></div>
                    <div class="dot-cw"></div>
                    <div class="dot-cw"></div>
                </div>
                <div class="orbit-ring-inner">
                    <div class="dot-acw"></div>
                    <div class="dot-acw"></div>
                </div>
                <div class="neural-sphere">
                    <div class="particle p1"></div>
                    <div class="particle p2"></div>
                    <div class="particle p3"></div>
                    <div class="particle p4"></div>
                </div>
            </div>

            <button class="btn-orbit" onclick="runOrbitAnalysis()">RUN ORBIT AI ANALYSIS ⚡</button>

            <!-- Signal Output Display -->
            <div id="signalDisplay" class="signal-display">
                <div class="signal-title">Generated Signal</div>
                <div id="signalValue" class="signal-value up">UP 🚀</div>
                <div id="analysisBox" class="analysis-box">
                    Analyzing candle history and market volatility...
                </div>
            </div>

            <a href="/" class="logout-btn">Log Out / Back</a>
        </div>

        <!-- SETTINGS VIEW (Quotex Pairs & Time Sync) -->
        <div id="settingsView" class="view-section">
            <h2 style="font-family:'Orbitron',sans-serif; font-size:16px; margin-bottom:20px; color:#00f2fe;">Quotex Trading Settings</h2>
            
            <div class="form-group">
                <label>Select Asset / Pair</label>
                <select id="assetSelect">
                    <option value="EURUSD">EUR/USD (Normal)</option>
                    <option value="EURUSD-OTC">EUR/USD (OTC)</option>
                    <option value="GBPUSD">GBP/USD (Normal)</option>
                    <option value="GBPUSD-OTC">GBP/USD (OTC)</option>
                    <option value="USDJPY">USD/JPY</option>
                    <option value="AUDCAD">AUD/CAD (OTC)</option>
                    <option value="EURJPY">EUR/JPY</option>
                </select>
            </div>

            <div class="form-group">
                <label>Candle Timeframe / Sync</label>
                <select id="candleTime">
                    <option value="5s">5 Seconds</option>
                    <option value="15s" selected>15 Seconds</option>
                    <option value="30s">30 Seconds</option>
                    <option value="1m">1 Minute</option>
                    <option value="5m">5 Minutes</option>
                </select>
            </div>

            <div class="form-group">
                <label>Trade Amount ($)</label>
                <input type="number" id="tradeAmount" value="10" min="1" max="1000">
            </div>

            <div class="form-group">
                <label>Risk Management Level</label>
                <select id="riskLevel">
                    <option value="conservative">Conservative (Low Risk)</option>
                    <option value="balanced" selected>Balanced (Standard)</option>
                    <option value="aggressive">Aggressive (High Frequency)</option>
                </select>
            </div>

            <button class="btn-save" onclick="saveSettings()">Save Settings</button>
        </div>

    </div>

    <script>
        function switchTab(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(viewId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function saveSettings() {
            const asset = document.getElementById('assetSelect').value;
            const timeframe = document.getElementById('candleTime').value;
            const amount = document.getElementById('tradeAmount').value;
            
            alert(`Settings saved successfully for ${asset} (${timeframe}) with $${amount}!`);
            switchTab('signalView');
        }

        function runOrbitAnalysis() {
            const btn = document.querySelector('.btn-orbit');
            const display = document.getElementById('signalDisplay');
            const valEl = document.getElementById('signalValue');
            const analysisEl = document.getElementById('analysisBox');

            btn.innerText = "ANALYZING MARKET DATA...";
            btn.style.opacity = "0.7";
            display.style.display = "none";

            setTimeout(() => {
                btn.innerText = "RUN ORBIT AI ANALYSIS ⚡";
                btn.style.opacity = "1";
                display.style.display = "block";

                // Simulated accurate AI decision based on market trends
                const outcomes = [
                    { 
                        signal: "UP 🚀", 
                        class: "up", 
                        logic: "Market bounced from support level. Bullish momentum confirmed via RSI divergence and 15s candle pattern. High probability of upward movement." 
                    },
                    { 
                        signal: "DOWN 📉", 
                        class: "down", 
                        logic: "Resistance rejection detected. Moving averages show strong downward cross with high volume sell pressure in current candle cycle." 
                    },
                    { 
                        signal: "NO TRADE ⚠️", 
                        class: "neutral", 
                        logic: "High volatility and market consolidation detected near key pivot. Risk is elevated; recommend waiting for a clean breakout." 
                    }
                ];

                // Random selection for demonstration
                const result = outcomes[Math.floor(Math.random() * outcomes.length)];

                valEl.innerText = result.signal;
                valEl.className = "signal-value " + result.class;
                analysisEl.innerHTML = `<strong>Logic & Analysis:</strong> ${result.logic}`;
            }, 1500);
        }
    </script>
</body>
</html>
