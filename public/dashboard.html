<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Z Bot - Trading Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(79, 172, 254, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Perfectly Aligned Clean Header */
        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px 10px 25px;
            z-index: 10;
        }

        .logo-area {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #00f2fe;
            letter-spacing: 1px;
        }

        .header-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-btn {
            background: rgba(13, 20, 35, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.25);
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .menu-btn.active, .menu-btn:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            color: #ffffff;
        }

        .menu-btn.logout {
            border-color: rgba(239, 68, 68, 0.4);
            color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
        }
        .menu-btn.logout:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            background: rgba(13, 20, 35, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 254, 0.05);
            margin-bottom: 30px;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .neural-core-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-orbit-system {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 1px dashed rgba(0, 242, 254, 0.2);
            animation: rotateClockwise 15s linear infinite;
        }
        .bg-orbit-node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 6px #00f2fe;
            top: 10px;
            left: 50%;
        }

        .neural-sphere {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 35%, #00f2fe 0%, #0c2d48 60%, #030712 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), inset 0 0 12px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            z-index: 2;
        }

        .neural-sphere::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(to right, rgba(0,242,254,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,242,254,0.1) 1px, transparent 1px);
            background-size: 14px 14px;
            opacity: 0.6;
        }

        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px #00f2fe;
            animation: pulseGlow 2s infinite ease-in-out;
            z-index: 3;
        }
        .p1 { width: 4px; height: 4px; top: 20%; left: 30%; animation-delay: 0s; }
        .p2 { width: 5px; height: 5px; top: 50%; left: 80%; animation-delay: 0.4s; }
        .p3 { width: 3px; height: 3px; top: 75%; left: 25%; animation-delay: 0.8s; }
        .p4 { width: 6px; height: 6px; top: 25%; left: 65%; animation-delay: 1.2s; }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.6); opacity: 1; }
        }

        .orbit-ring-outer {
            position: absolute;
            width: 134px;
            height: 134px;
            border-radius: 50%;
            border: 1px dashed rgba(0, 242, 254, 0.25);
            animation: rotateClockwise 8s linear infinite;
            z-index: 4;
        }
        .dot-cw {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe;
        }
        .dot-cw:nth-child(1) { top: 0; left: calc(50% - 2.5px); }
        .dot-cw:nth-child(2) { bottom: 0; left: calc(50% - 2.5px); }
        .dot-cw:nth-child(3) { left: 0; top: calc(50% - 2.5px); }
        .dot-cw:nth-child(4) { right: 0; top: calc(50% - 2.5px); }

        .orbit-ring-inner {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1px dashed rgba(79, 172, 254, 0.2);
            animation: rotateAntiClockwise 6s linear infinite;
            z-index: 4;
        }
        .dot-acw {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #4facfe;
            border-radius: 50%;
            box-shadow: 0 0 6px #4facfe;
        }
        .dot-acw:nth-child(1) { top: 15%; left: 15%; }
        .dot-acw:nth-child(2) { bottom: 15%; right: 15%; }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes rotateAntiClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .status-badge {
            background: rgba(0, 255, 128, 0.1);
            border: 1px solid rgba(0, 255, 128, 0.3);
            color: #00ff80;
            padding: 6px 14px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .timer-info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Orbit Button */
        .btn-orbit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 14px;
            color: #030712;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(0, 242, 254, 0.4);
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .btn-orbit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 242, 254, 0.6);
        }

        /* Broker Server Clock & Status directly below the button */
        .server-time-box {
            background: rgba(3, 7, 18, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        .broker-clock-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .broker-clock-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #00ff80;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .candle-phase-status {
            font-size: 11px;
            color: #00f2fe;
            font-weight: 500;
        }

        /* Signal Display Box */
        .signal-display {
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }
        .signal-title {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .signal-expiry {
            font-size: 10px;
            color: #00f2fe;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .win-rate-badge {
            display: inline-block;
            background: rgba(0, 255, 128, 0.15);
            border: 1px solid rgba(0, 255, 128, 0.4);
            color: #00ff80;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .signal-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .signal-value.up { color: #00ff80; text-shadow: 0 0 15px rgba(0, 255, 128, 0.5); }
        .signal-value.down { color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .signal-value.neutral { color: #f59e0b; text-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }

        .analysis-box {
            font-size: 11px;
            color: #cbd5e1;
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #00f2fe;
            line-height:
