<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Z Bot - Trading Signals AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Ambient Glow */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.1) 0%, rgba(79, 172, 254, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 30px;
            background: rgba(13, 20, 35, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 254, 0.05);
            text-align: center;
        }

        .shield-icon {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            margin-bottom: 15px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(0, 242, 254, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 30%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Neural Core / Football Sphere Styling */
        .neural-core-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .neural-sphere {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 35%, #00f2fe 0%, #0c2d48 60%, #030712 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }

        /* Football Hexagon Pattern Effect inside Sphere */
        .neural-sphere::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(to right, rgba(0,242,254,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,242,254,0.1) 1px, transparent 1px);
            background-size: 16px 16px;
            opacity: 0.6;
        }

        /* Inner Glowing Particles */
        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px #00f2fe;
            animation: pulseGlow 2s infinite ease-in-out;
        }
        .p1 { width: 4px; height: 4px; top: 30%; left: 40%; animation-delay: 0s; }
        .p2 { width: 5px; height: 5px; top: 60%; left: 70%; animation-delay: 0.5s;
